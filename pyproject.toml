[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-colour-analysis"
version = "0.1.0"
description = "Streamlit personal colour analysis application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.33,<2",
  "opencv-python>=4.8,<5",
  "mediapipe>=0.10,<0.11",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<0.12",
  "mypy>=1.11,<1.12"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
files = [
  "src/aggregation.py",
  "src/calibration.py",
  "src/color_features.py",
  "src/config.py",
  "src/copy_renderer.py",
  "src/image_quality.py",
  "src/json_utils.py",
  "src/palettes.py",
  "src/paths.py",
  "src/season_rules.py"
]
